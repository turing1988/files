# Generated by Nextin Hub
# Rule data is embedded or read from Nextin's bundled MRS data; no remote rule-provider is required.
# Rule data source: MetaCubeX/meta-rules-dat (GPL-3.0).
x-nextin:
  version: 1
  mode: subscription-template
  name: "Main"

proxies: []

proxy-groups:

  - # filter: "^(?!.*[：:，]).*$"
    name: PROXY
    lazy: false
    tolerance: 5
    interval: 300
    type: url-test
    include-all-proxies: true
    url: 'https://www.gstatic.com/generate_204'
    proxies:
      - ASIA
      - EURO
      - CHINA
      - USA
  - name: ASIA
    type: url-test
    include-all-proxies: true
    filter: (?i)日本|JP|Japan|新加坡|Singapore|SGP|马来|Malaysia|韩国|Korea|印度|India
  - name: EURO
    type: url-test
    include-all-proxies: true
    filter: (?i)英国|UK|土耳|Turkey|阿根|Argentina|俄国|俄罗斯|Russia|德国|German|荷兰|Netherlands|Holland|澳大利亚|Australia
  - name: CHINA
    type: url-test
    include-all-proxies: true
    filter: (?i)HK|香港|Hong.?Kong|台湾|TW|Tai.?Wan
  - name: USA
    type: url-test
    include-all-proxies: true
    filter: (?i)美国|US|United.?States
  - name: TUR
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)((?:土耳其|TUR|\\bTurkey\\b))
  - name: MYS
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)((?:马来西亚|MY|\\bMalaysia\\b))
  - name: JP
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)日本|JP|Japan
  - name: HKG
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)香港|HK|Hong.?Kong
  - name: TW
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)台湾|TW|Tai.?Wan
  - name: SGP
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)新加坡|Singapore|SGP
  - name: UK
    hidden: true
    type: url-test
    include-all-proxies: true
    filter: (?i)英国|UK
  - name: AI
    type: url-test
    include-all-proxies: true
    filter: (?i)美国|US|United.?States

rule-providers:
  my_direct:
    behavior: classical
    interval: 86400
    type: http
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/direct.yaml'
  my_proxy:
    behavior: classical
    interval: 86400
    type: http
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/proxy.yaml'
  china:
    behavior: classical
    interval: 86400
    type: http
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/china.yaml'
  asia:
    behavior: classical
    interval: 86400
    type: http
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/asia.yaml'
  euro:
    behavior: classical
    interval: 86400
    type: http
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/euro.yaml'
  usa:
    behavior: classical
    interval: 86400
    type: http
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/usa.yaml'
  proxy:
    interval: 86400
    type: http
    behavior: classical
    url: 'https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Proxy/Proxy_Classical.yaml'
    format: yaml
  broker:
    type: http
    behavior: classical
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/forecho/broker-rules@main/rule/Clash/Broker.yaml"
    
rules:
  - PROCESS-NAME,Spotify,SGP
  - GEOSITE,private,DIRECT
  - RULE-SET,my_direct,DIRECT
  - AND,((NETWORK,UDP),(DST-PORT,443/4483/9305)),REJECT
  - GEOSITE,category-ads-all,REJECT
  - RULE-SET,usa,USA
  - RULE-SET,euro,EURO
  - RULE-SET,asia,ASIA
  - RULE-SET,china,CHINA
  - RULE-SET,my_proxy,PROXY
  - GEOSITE,apple-intelligence,AI
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,category-porn,JP
  - GEOIP,telegram,JP
  - GEOSITE,telegram,JP
  - GEOSITE,spotify,SGP
  - GEOSITE,github,ASIA
  - GEOSITE,google,USA
  - RULE-SET,broker,HKG
  - RULE-SET,proxy,PROXY
  - GEOSITE,geolocation-!cn,PROXY
  - GEOIP,JP,JP,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,DIRECT