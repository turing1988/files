x-nextin:
  mode: subscription-template
  name: "Main"
mode: rule
ipv6: true
allow-lan: true
mixed-port: 7890
log-level: warning
dns:
  ipv6: true
  enable: true
  enhanced-mode: fake-ip
  use-hosts: true
  default-nameserver:
    - 180.76.76.76
    - 223.6.6.6
    - 8.8.8.8
    - system
  nameserver-policy:
    '+.baidu-int.com': 10.21.155.22
    '+.baidu.com': 180.76.76.76
  fake-ip-filter: ['*.lan', localhost.ptlogin2.qq.com]
  nameserver: ['https://doh.pub/dns-query', 'tls://dot.pub', 'https://223.5.5.5/dns-query', 'https://223.6.6.6/dns-query', 'tls://dns.alidns.com', 'tls://223.5.5.5:853', 'tls://223.6.6.6:853']
  fallback: ['https://doh.pub/dns-query', 'tls://dot.pub', 'https://223.5.5.5/dns-query', 'https://223.6.6.6/dns-query', 'tls://dns.alidns.com', 'tls://223.5.5.5:853', 'tls://223.6.6.6:853']
  fallback-filter: {geoip: true, ipcidr: [240.0.0.0/4, 0.0.0.0/32]}
  skip-cert-verify: false
experimental:
  ignore-resolve-fail: true
proxies: []
proxy-groups:
  - name: PROXY
    tolerance: 3
    interval: 600
    type: url-test
    include-all: true
    url: 'https://www.gstatic.com/generate_204'
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Universal/Auto_Speed.png
    filter: ^(?!.*(?:([：:，]|流量|套餐|到期|重置|Traffic|Expire|订阅|过滤|不代理|剩余|官网|电报))).*$
  - name: ASIA
    type: url-test
    include-all: true
    filter: (?i)日本|JP|Japan|新加坡|Singapore|SGP|狮城|马来|Malaysia|韩国|Korea|印度|India
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Asia_Map.png
  - name: EURO
    type: url-test
    include-all: true
    filter: (?i)英国|UK|土耳|Turkey|阿根|Argentina|德国|荷兰|澳|俄罗斯
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/European_Union.png
  - name: CHINA
    type: url-test
    include-all: true
    filter: (?i)HK|香港|Hong.?Kong|台湾|TW|Tai.?Wan
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/China.png
  - name: USA
    type: url-test
    include-all: true
    filter: (?i)美国|US|United.?States|加拿大|Canada
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/United_States.png
  - name: JP
    hidden: true
    type: url-test
    include-all: true
    filter: (?i)日本|JP|Japan
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Japan.png
  - name: HKG
    hidden: true
    type: url-test
    include-all: true
    filter: (?i)香港|HK|Hong.?Kong
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Hong_Kong.png
  - name: SGP
    hidden: true
    type: url-test
    include-all: true
    filter: (?i)新加坡|Singapore|SGP|狮城
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Singapore.png
  - name: PURE_USA
    type: url-test
    include-all: true
    filter: (?i)(US|(美国.*(?:(aws|中继))))
    icon: https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/openai.png
rule-provides:
  my_direct:
    type: http
    format: yaml
    interval: 21600
    behavior: classical
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/direct.yaml'
  my_proxy:
    type: http
    format: yaml
    interval: 21600
    behavior: classical
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/proxy.yaml'
  china:
    type: http
    format: yaml
    interval: 21600
    behavior: classical
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/china.yaml'
  asia:
    type: http
    format: yaml
    interval: 21600
    behavior: classical
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/asia.yaml'
  euro:
    type: http
    format: yaml
    interval: 21600
    behavior: classical
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/euro.yaml'
  usa:
    type: http
    format: yaml
    interval: 21600
    behavior: classical
    url: 'https://raw.githubusercontent.com/turing1988/files/main/domain_classical/usa.yaml'
  proxy:
    type: http
    format: yaml
    behavior: classical
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy_Classical.yaml'
  broker:
    type: http
    format: yaml
    behavior: classical
    url: "https://raw.githubusercontent.com/forecho/broker-rules/main/rule/Clash/Broker.yaml"
rules:
  - GEOSITE,netflix,PURE_USA
  - PROCESS-NAME,Spotify,SGP
  - GEOSITE,private,DIRECT
  - RULE-SET,direct,DIRECT
  - GEOSITE,category-ads-all,REJECT
  - RULE-SET,usa,USA
  - RULE-SET,euro,EURO
  - RULE-SET,asia,ASIA
  - RULE-SET,china,CHINA
  - RULE-SET,my_proxy,PROXY
  - GEOSITE,apple-intelligence,PURE_USA
  - GEOSITE,category-ai-!cn,PURE_USA
  - GEOSITE,google,PURE_USA
  - GEOSITE,category-porn,JP
  - GEOSITE,telegram,JP
  - GEOSITE,spotify,SGP
  - GEOSITE,github,CHINA
  - RULE-SET,broker,HKG
  - RULE-SET,proxy,PROXY
  - GEOIP,telegram,JP
  - GEOIP,JP,JP,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,DIRECT
